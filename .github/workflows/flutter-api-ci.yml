name: Flutter API Tests

on:
  workflow_call:
    inputs:
      order_lifecycle:
        description: Run the order and kitchen suite instead of login and POS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://pos:mobile-test-only@127.0.0.1:5544/pos_mobile_test
      TEST_DATABASE_URL: postgresql://pos:mobile-test-only@127.0.0.1:5544/pos_mobile_test
      NODE_ENV: test
      PORT: 3001
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pos_mobile_test
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: mobile-test-only
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_mobile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Build the test API and migrate PostgreSQL
        working-directory: server
        run: |
          npm ci
          npm run build
          npx prisma migrate deploy

      - name: Prepare login and POS fixtures
        if: ${{ !inputs.order_lifecycle }}
        working-directory: server
        run: |
          npx ts-node -P prisma/tsconfig.seed.json prisma/seed-test.ts
          npx ts-node -P prisma/tsconfig.seed.json prisma/mobile-pos-fixtures.ts prepare

      - name: Prepare order and kitchen fixtures
        if: ${{ inputs.order_lifecycle }}
        working-directory: server
        run: npx ts-node -P prisma/tsconfig.seed.json prisma/mobile-pos-fixtures.ts prepare --orders

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Enable KVM for Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          test -r /dev/kvm && test -w /dev/kvm

      - name: Start the test API and wait for HTTP readiness
        working-directory: server
        run: |
          node dist/main > flutter-api.log 2>&1 &
          api_pid=$!
          for attempt in {1..30}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
            status=$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/auth/me || true)
            if [ "$status" = '401' ]; then exit 0; fi
            sleep 1
          done
          cat flutter-api.log
          exit 1

      - name: Run Flutter suites on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          FLUTTER_API_SUITES: ${{ inputs.order_lifecycle && 'orders' || 'auth pos' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 2048M
          ndk: '28.2.13676358'
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          working-directory: mobile
          script: >-
            result=0;
            for suite in $FLUTTER_API_SUITES; do
            dart run tool/run_integration_tests.dart --suite="$suite" -d "$ANDROID_SERIAL" || result=1;
            done;
            exit "$result"

      - name: Upload Flutter API reports and API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.order_lifecycle && 'flutter-api-order-results' || 'flutter-api-integration-results' }}
          path: |
            mobile/reports/integration/
            server/flutter-api.log
          if-no-files-found: warn
