name: Web CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

env:
  # Keep this aligned with the Playwright fixture for build-time API rewrites.
  API_URL: http://127.0.0.1:3101
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  unit-integration-tests:
    name: Stage 1 - Lint, Type Check, Unit and Component Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check app and test files
        run: npm run typecheck
      - name: Unit and component integration tests with coverage
        run: npm run test:coverage
      - name: Upload Vitest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-vitest-results
          path: |
            web/reports/vitest/
            web/reports/vitest.xml
            web/coverage/
          if-no-files-found: warn
          retention-days: 14

  browser-tests:
    name: Stage 2 - Production Build, Browser Smoke and E2E Tests
    needs: unit-integration-tests
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with @playwright/test in web/package-lock.json.
      # Browsers and OS dependencies are bundled, avoiding Ubuntu mirror setup.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify bundled Chromium matches Playwright
        run: |
          node -e 'const fs = require("node:fs"); const { chromium } = require("playwright"); const executable = chromium.executablePath(); if (!fs.existsSync(executable)) { console.error("Bundled Chromium is missing. Align the Playwright container image version with web/package-lock.json."); process.exit(1); }'
      - name: Build production app
        run: npm run build
      - name: Browser smoke and end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-results
          path: |
            web/reports/playwright.xml
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14
